rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not provide custom actions.
  appropriate-polling:
    status: done
    comment: The coordinator polls the hosted provider every five minutes; manual entity refresh remains available.
  brands:
    status: done
    comment: A local custom-integration brand icon is shipped in the integration's brand directory.
  common-modules:
    status: done
    comment: Provider, coordinator, models, endpoint resolution and shared device metadata are separated into focused modules.
  config-flow-test-coverage:
    status: done
    comment: Config-flow setup, validation, duplicate, reauth, reconfigure and defensive paths are directly tested.
  config-flow:
    status: done
    comment: Setup is UI-only and supports fixed or person/device_tracker endpoints.
  dependency-transparency:
    status: done
    comment: The manifest has no third-party Python requirements; the integration will use Home Assistant's aiohttp facilities directly.
  docs-actions:
    status: exempt
    comment: The integration does not provide custom actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide custom triggers.
  entity-event-setup:
    status: exempt
    comment: Route entities will not subscribe directly to external events.
  entity-unique-id:
    status: done
    comment: Duration and Distance have stable per-config-entry unique IDs.
  has-entity-name:
    status: done
    comment: Route sensors use has_entity_name with translated entity names.
  runtime-data:
    status: done
    comment: Typed ConfigEntry.runtime_data owns the client and coordinator.
  test-before-configure:
    status: done
    comment: Current endpoint coordinates and provider access are validated before a config entry is created.
  test-before-setup:
    status: done
    comment: Initial coordinator refresh verifies the configured route during setup.
  unique-config-entry:
    status: done
    comment: Stable route signatures prevent duplicate profile/endpoint-reference configurations.

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration has no service actions or controllable entity actions.
  config-entry-unloading:
    status: done
    comment: Sensor platforms unload through Home Assistant's config-entry lifecycle.
  docs-configuration-parameters:
    status: done
    comment: README documents the API key, route name, fixed/dynamic endpoint types and fixed polling interval.
  docs-installation-parameters:
    status: done
    comment: README documents HACS/manual installation and API-key setup.
  entity-unavailable:
    status: done
    comment: Coordinator failures make route entities unavailable instead of exposing guessed values.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: DataUpdateCoordinator reports update failure and recovery while provider/location failures remain classified.
  parallel-updates:
    status: done
    comment: Sensor platform declares PARALLEL_UPDATES = 0 because updates are coordinator-driven.
  reauthentication-flow:
    status: done
    comment: Confirmed authentication rejection starts Home Assistant reauthentication; ambiguous 403 responses do not.
  test-coverage:
    status: done
    comment: CI enforces at least 95 percent integration statement coverage.

  # Gold
  devices:
    status: done
    comment: Each configured route is represented as one logical service device.
  diagnostics:
    status: done
    comment: Diagnostics redact credentials and both endpoint definitions, preventing precise coordinate disclosure.
  discovery:
    status: exempt
    comment: Routes are user-configured cloud-service resources and are not network-discoverable.
  discovery-update-info:
    status: exempt
    comment: There is no discoverable network address or connection information to update.
  docs-data-update: done
  docs-examples:
    status: done
    comment: README documents the BODS dynamic-walking use case and a dashboard example.
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration does not integrate physical devices; configured routes are logical service devices.
  docs-supported-functions: done
  docs-troubleshooting:
    status: done
    comment: README covers unavailable location entities, authentication, 403, rate limiting and no-route behaviour.
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: The v0.1 model is one logical route device per config entry; devices are not dynamically added within an entry.
  entity-category:
    status: exempt
    comment: The integration exposes only two primary route sensors; there are no diagnostic/configuration entities requiring a category.
  entity-device-class:
    status: done
    comment: Duration and Distance use the standard Home Assistant duration and distance device classes.
  entity-disabled-by-default:
    status: exempt
    comment: The initial integration has only two primary route sensors and neither is low-value or noisy.
  entity-translations:
    status: done
    comment: Sensor names are supplied through translation keys.
  exception-translations:
    status: done
    comment: Config-entry authentication failure uses a translated exception key.
  icon-translations:
    status: done
    comment: Duration and Distance icons are supplied through icons.json translation keys.
  reconfiguration-flow:
    status: done
    comment: Route name, endpoint types and endpoint references can be changed through the UI while retaining credentials.
  repair-issues:
    status: exempt
    comment: No current failure mode requires a Repair; authentication uses reauth and transient/provider failures recover automatically.
  stale-devices:
    status: exempt
    comment: One logical route device is tied directly to each config entry and is removed with that entry.

  # Platinum
  async-dependency:
    status: done
    comment: The integration intentionally has no external client dependency and all planned network I/O is asynchronous.
  inject-websession:
    status: done
    comment: Config validation and runtime clients receive Home Assistant's shared aiohttp ClientSession.
  strict-typing:
    status: done
    comment: Strict mypy is enforced in CI for all current integration source and will remain a mandatory gate.
